function renderAll(){renderBar();if(S.ui.view==='plan')renderPlan();if(S.ui.view==='unit')renderUnit();if(S.ui.view==='week')renderWeek();if(S.ui.view==='table')renderTable();if(S.ui.view==='grades')renderGrades();if(S.ui.view==='data')renderData()}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target;
  const tab=t.closest('.tabs button'); if(tab){if(UI.ttCell){ttCellApply();ttCellClose()}if(UI.dc){dcApply();dcClose()}if(UI.noteSid){$('#sheet').hidden=true;UI.noteSid=null}if(UI.ld)ldClose();UI.dayEdit=false;S.ui.view=tab.dataset.view;if(S.ui.view!=='plan'){UI.edit=false;$('#sheet').hidden=true}save();renderAll();window.scrollTo(0,0);return}
  if(UI.lpFired&&t.closest('[data-act]')){UI.lpFired=false;return}
  const nb=t.closest('#stage [data-note], #rlist [data-note]'); if(nb&&!UI.edit){noteSheet(nb.dataset.note);return}
  const seatBtn=t.closest('#stage [data-act], #rlist [data-act]');
  if(seatBtn&&!UI.edit){const sid=seatBtn.closest('[data-sid]').dataset.sid;act(sid,seatBtn.dataset.act);return}
  const d=t.closest('[data-do]'); if(d&&DO[d.dataset.do]){DO[d.dataset.do](d);return}
  const c=t.closest('[data-confirm]'); if(c&&CONFIRM[c.dataset.confirm]){arm(c,()=>CONFIRM[c.dataset.confirm](c.dataset.id));return}
  const wk=t.closest('[data-wk]'); if(wk){const [ds,p]=wk.dataset.wk.split('|');lessonDlg(ds,+p);return}
  const lo=t.closest('[data-ldopen]'); if(lo){const [gid,lid]=lo.dataset.ldopen.split('|');ldOpen(gid,lid);return}
  const dcc=t.closest('[data-dc]'); if(dcc){const [ds,p]=dcc.dataset.dc.split('|');UI.dcG=undefined;UI.dcLay=null;UI.dcTmp=null;dcSheet(ds,+p);return}
  const tc=t.closest('[data-ttcell]'); if(tc){const [d,p]=tc.dataset.ttcell.split('|').map(Number);UI.ttG=undefined;UI.ttLay=null;UI.ttTmp=null;ttCellSheet(d,p);return}
  const gh=t.closest('[data-gbhj]'); if(gh){UI.gbHJ=gh.dataset.gbhj==='y'?'y':+gh.dataset.gbhj;renderGrades();return}
  const gi=t.closest('[data-gbitem]'); if(gi){gbItemSheet(gi.dataset.gbitem);return}
  const mv=t.closest('[data-mv]'); if(mv){const u=curUnit(G()),i=u.items.findIndex(x=>x.id===mv.dataset.mv),j=i+(+mv.dataset.d);
    if(j>=0&&j<u.items.length){[u.items[i],u.items[j]]=[u.items[j],u.items[i]];save();renderUnit()}return}
  const pick=t.closest('[data-pick]'); if(pick){S.ui.groupId=pick.dataset.pick;S.ui.view='plan';UI.edit=false;save();renderAll();return}
  const op=t.closest('[data-open]'); if(op){const g=G();S.active[g.id]=op.dataset.open;const ol=L(g);if(ol&&g.layouts.find(x=>x.id===ol.layout))g.layoutId=ol.layout;S.ui.view='plan';UI.edit=false;save();renderAll();return}
  const mo=t.closest('[data-mode]'); if(mo){UI.mode=mo.dataset.mode;UI.sort.k=UI.sort.k==='status'||UI.sort.k==='n'?'name':UI.sort.k;renderTable();return}
  const hy=t.closest('[data-hy]'); if(hy){const h=+hy.dataset.hy;[UI.from,UI.to]=h?halfYear(h):['',''];if(!h){UI.from='';UI.to=''}renderTable();return}
  const so=t.closest('th[data-sort]'); if(so){const k=so.dataset.sort;UI.sort=UI.sort.k===k?{k,dir:-UI.sort.dir}:{k,dir:k==='name'||k==='status'?1:-1};renderTable();return}
  if(t.id==='overlay') DO.expClose();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='grp'){S.ui.groupId=t.value;UI.edit=false;$('#sheet').hidden=true;pending.clear();save();renderAll()}
  else if(t.id==='lStart'){const l=L();if(l&&t.value){l.start=t.value;save()}}
  else if(t.id==='tFrom'){UI.from=t.value;renderTable()}
  else if(t.id==='tTo'){UI.to=t.value;renderTable()}
  else if(t.id==='tLesson'){UI.lessonSel=t.value;renderTable()}
  else if(t.id==='lTopic'){const l=L();if(l&&UI.topicOrig&&UI.topicOrig.lid===l.id){const o=UI.topicOrig.t;UI.topicOrig=null;
      if(o&&o!==l.topic&&l.plan){UI.shift={lid:l.id,t:o}}if(S.ui.view==='plan')renderDoc()}}
  else if(t.id==='dPlan'){const g=G(),l=L(g);if(l){if(t.value){const [u,i]=t.value.split('|');l.plan={u,i};const f=findItem(g,l.plan);if(f&&f.it.topic)l.topic=f.it.topic}else delete l.plan;
      UI.shift=null;save();renderBar();renderDoc()}}
  else if(t.id==='ttG'||t.id==='ttLay'){UI.ttTmp={cls:$('#ttCls').value,sub:$('#ttSub').value,room:$('#ttRoom').value};if(t.id==='ttG'){UI.ttG=t.value;UI.ttLay=null}else UI.ttLay=t.value;const c=UI.ttCell;ttCellSheet(c.d,c.p);ttCellApply()}
  else if(t.id==='ttCls'||t.id==='ttSub'||t.id==='ttRoom'){ttCellApply()}
  else if(t.id==='dcG'||t.id==='dcLay'||t.id==='dcCancel'){UI.dcTmp=dcTmpRead();if(t.id==='dcG'){UI.dcG=t.value;UI.dcLay=null}else if(t.id==='dcLay')UI.dcLay=t.value;const c=UI.dc;dcSheet(c.ds,c.p);dcApply()}
  else if(t.id==='dcCls'||t.id==='dcSub'||t.id==='dcRoom'){dcApply()}
  else if(t.id==='ttVerSel'){UI.ttVer=t.value;renderWeek()}
  else if(t.dataset.free){const [i,f]=t.dataset.free.split('|');const x=S.free[+i];if(x){x[f]=t.value;if(f==='from'&&(!x.to||x.to<x.from))x.to=x.from;save();renderWeek()}}
  else if(t.dataset.per){const [n,f]=t.dataset.per.split('|');const x=per(+n);if(x&&t.value){x[f]=t.value;save()}}
  else if(t.dataset.lgo){const g=G(),l=g.lessons.find(x=>x.id===t.dataset.l);if(l){l.gOv=l.gOv||{};if(t.value==='x')l.gOv[t.dataset.lgo]='x';else if(t.value)l.gOv[t.dataset.lgo]=+t.value.slice(2);else delete l.gOv[t.dataset.lgo];save();renderTable()}}
  else if(t.dataset.gbv){const [iid,sid]=t.dataset.gbv.split('|');const it=GB(G()).items.find(x=>x.id===iid);if(it){if(!t.value)delete it.v[sid];else if(t.value[0]==='p')it.v[sid]={p:+t.value.slice(2)};else it.v[sid]={s:t.value.slice(2)};save();renderGrades()}}
  else if(t.dataset.mov){const b=GB(G());if(t.value)b.mitOv[UI.gbHJ][t.dataset.mov]=+t.value.slice(2);else delete b.mitOv[UI.gbHJ][t.dataset.mov];save();renderGrades()}
  else if(t.dataset.hov){const b=GB(G());if(t.value)b.hjOv[UI.gbHJ][t.dataset.hov]=+t.value.slice(2);else delete b.hjOv[UI.gbHJ][t.dataset.hov];save();renderGrades()}
  else if(t.dataset.yov){const b=GB(G()),id=t.dataset.yov;if(t.value){b.yOv[id]=Object.assign(b.yOv[id]||{},{p:+t.value.slice(2)})}else delete b.yOv[id];save();renderGrades()}
  else if(t.dataset.ywhy){const b=GB(G());if(b.yOv[t.dataset.ywhy]){b.yOv[t.dataset.ywhy].why=t.value;save()}}
  else if(t.id==='gbW'){const b=GB(G());b.wW=Math.max(0,Math.min(100,numIn(t.value)));save();renderGrades()}
  else if(t.dataset.cat){const [id,f]=t.dataset.cat.split('|');const c=GB(G()).cats.find(x=>x.id===id);if(c){c[f]=f==='w'?Math.max(0,numIn(t.value)):(t.value.trim()||c.name);save();renderGrades()}}
  else if(t.dataset.catauto){GB(G()).cats.forEach(c=>c.auto=c.id===t.dataset.catauto);save();renderGrades()}
  else if(t.id==='gbKid'){UI.gbKid=t.value}
  else if(t.id==='ldG'){UI.ldG=t.value;UI.ldLay=undefined;UI.ldItem=undefined;ldRender()}
  else if(t.id==='ldLay'){UI.ldLay=t.value;UI.ldItem=undefined;ldRender()}
  else if(t.id==='ldItem'){UI.ldItem=t.value;if(!t.value)UI.ldTxt='';ldRender();if(!t.value){const x=$('#ldTxt');if(x)x.focus()}}
  else if(t.id==='uSel'){G().unitId=t.value;save();renderUnit()}
  else if(t.id==='tLay'){UI.layF=t.value||null;renderTable()}
  else if(t.id==='laySel'){const g=G();g.layoutId=t.value;const l=L(g);if(l){l.layout=t.value;l.members=members(g).map(s=>s.id)}pending.clear();$('#sheet').hidden=true;save();renderPlan()}
  else if(t.id==='cdSel'){S.settings.cd=+t.value;save()}
  else if(t.id==='viewSel'){S.settings.view=t.value;save();renderAll()}
  else if(t.id==='gScale'){GR(G()).scale=t.value;save();if(S.ui.view==='table')renderTable();else if(S.ui.view==='grades')renderGrades();else renderData()}
  else if(t.id==='gBase'){const v=Math.max(0.67,Math.min(6,+t.value));GR(G()).base=v;save();if(S.ui.view==='table')renderTable()}
  else if(t.dataset.gw){const v=Math.max(0,Math.abs(numIn(t.value)));GR(G()).w[t.dataset.gw]=v;t.value=fmtNum(v);save();if(S.ui.view==='table')renderTable()}
  else if(t.dataset.rename){const x=S.groups.find(g=>g.id===t.dataset.rename);if(x&&t.value.trim()){x.name=t.value.trim();save();renderBar()}}
  else if(t.id==='importFile'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{let d=null;try{d=JSON.parse(r.result);if(d&&d.kind==='timetable'){importTimetable(d);return}if(!d||!Array.isArray(d.groups))throw 0}catch(e){UI.importData=null;alertBox('Die Datei ist keine gültige AT-Tool-Datei.');renderData();return}
      if(d.kind==='capture'){UI.importData=null;importCapture(d);return}
      UI.importData=d;renderData()};
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='lTopic'){const l=L();if(l){topicEdited(l,t.value);save()}}
  else if(t.id==='ldTxt'){UI.ldTxt=t.value}
  else if(t.id==='noteTxt'){const l=L();if(l&&UI.noteSid){const e=entry(l,UI.noteSid);e.note=t.value;if(!e.note.trim())delete e.note;save()}}
  else if(t.id==='noteLate'){const l=L();if(l&&UI.noteSid){const e=entry(l,UI.noteSid);const m=parseInt(t.value,10);e.late=m>0?m:-1;save()}}
  else if(t.id==='dDoc'){const l=L();if(l){l.doc=t.value;save()}}
  else if(t.id==='dHw'){const l=L();if(l){l.hw=t.value;save()}}
  else if(t.id==='uTitle'){const u=curUnit(G());if(u){u.title=t.value;save()}}
  else if(t.dataset.item){const g=G(),u=curUnit(g),it=u&&u.items.find(x=>x.id===t.dataset.item);if(it){it.topic=t.value;
      // offene Stunden dieser Reihe, die heute angelegt und noch nicht umbenannt sind, ziehen mit
      lessonsOf(g,it.id).forEach(l=>{if(l.date===todayStr())l.topic=t.value});save()}}
  else if(t.id==='edName'){const st=G().students.find(s=>s.id===UI.editSid);if(st){st.name=t.value;save();const el=$(`#stage [data-sid="${st.id}"] .name`);if(el)el.textContent=t.value}}
});
function alertBox(msg){$('#dlg').innerHTML=`<h2>Hinweis</h2><p style="margin:0">${esc(msg)}</p><div class="row2"><button class="btn primary" data-do="expClose">OK</button></div>`;$('#overlay').hidden=false}
const stage=$('#stage');
/* Eintrag zurücknehmen: Rechtsklick (MacBook) oder langes Drücken (iPhone/iPad) auf ein Symbol */
function undoOne(sid,kind){
  const l=L(); if(!l||l.done) return; const e=entry(l,sid,false); if(!e) return;
  const key=sid+'|'+kind, pq=pending.get(key); if(pq){clearTimeout(pq.timer);pending.delete(key)}
  if(CKSET.has(kind)){ if(!cnt(e,kind)) return flashBtn(sid,kind,false); e.c[kind]=cnt(e,kind)-1 }
  else if(kind==='late'){ if(!isLate(e)) return flashBtn(sid,kind,false); e.late=0 }
  else return;
  save(); renderSeat(sid); flashBtn(sid,kind,true);
}
function flashBtn(sid,kind,ok){const b=$(`[data-sid="${sid}"] [data-act="${kind}"]`);if(!b)return;b.classList.remove('dec','nodec');void b.offsetWidth;b.classList.add(ok?'dec':'nodec');setTimeout(()=>b.classList.remove('dec','nodec'),700)}
document.addEventListener('contextmenu',ev=>{const b=ev.target.closest('#stage [data-act], #rlist [data-act]');if(!b||UI.edit)return;
  ev.preventDefault();undoOne(b.closest('[data-sid]').dataset.sid,b.dataset.act)});
let lp=null;
document.addEventListener('pointerdown',ev=>{if(ev.pointerType==='mouse')return;const b=ev.target.closest('#stage [data-act], #rlist [data-act]');if(!b||UI.edit)return;
  const sid=b.closest('[data-sid]').dataset.sid,kind=b.dataset.act;
  lp={x:ev.clientX,y:ev.clientY,t:setTimeout(()=>{lp=null;UI.lpFired=true;undoOne(sid,kind);if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}},550)}},true);
const lpEnd=()=>{if(lp){clearTimeout(lp.t);lp=null}};
document.addEventListener('pointerup',lpEnd,true);document.addEventListener('pointercancel',lpEnd,true);
document.addEventListener('pointermove',ev=>{if(lp&&Math.hypot(ev.clientX-lp.x,ev.clientY-lp.y)>10)lpEnd()},true);
stage.addEventListener('pointerdown',onDown);
stage.addEventListener('pointermove',onMove);
stage.addEventListener('pointerup',onUp);
stage.addEventListener('pointercancel',onUp);
document.addEventListener('toggle',ev=>{if(ev.target.id==='gwBox')UI.gwOpen=ev.target.open;if(ev.target.id==='gbBox')UI.gbOpen=ev.target.open},true);
let rt,lastCp=null;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const cp=isCompact();if(cp!==lastCp){lastCp=cp;renderAll()}else if(S.ui.view==='plan'&&!cp)sizeRoom()},80)});

/* Bildschirm wach halten */
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&L())keepAwake()});

/* Offline-Version: Service Worker nur in der eigenständigen Fassung */
if(window.AT_STANDALONE&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

load(); renderAll();
})();
